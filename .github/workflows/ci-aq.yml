name: CI (aq)

on:
  push:
  pull_request:

jobs:
  aq:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Install qemu/socat/ovmf
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils socat ovmf wget gpg ca-certificates coreutils \
            meson ninja-build pkg-config liblua5.4-dev libinih-dev libglib2.0-dev \
            git build-essential

      - name: Cache aq + tio binaries
        id: aq-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/aq
            /usr/local/bin/tio
          key: aq-2.3.0-tio-3.9-${{ runner.os }}

      - name: Install aq + tio if cache miss
        if: steps.aq-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL https://raw.githubusercontent.com/pirj/aq/v2.3.1/aq -o /tmp/aq
          chmod +x /tmp/aq
          sudo mv /tmp/aq /usr/local/bin/aq
          aq --version
          git clone --depth 1 --branch v3.9 https://github.com/tio/tio.git /tmp/tio
          cd /tmp/tio && meson setup build && meson compile -C build && sudo meson install -C build

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Compute snapshot key
        id: key
        run: |
          KEY=$(sha256sum Gemfile.lock db/schema.rb Dockerfile bin/aq-provision \
                | awk '{print $1}' | sha256sum | head -c 16)
          echo "snapkey=$KEY" >> "$GITHUB_OUTPUT"
          echo "Snapshot key: $KEY"

      - name: Cache aq alpine base image
        uses: actions/cache@v4
        with:
          path: ~/.local/share/aq/x86_64
          key: aq-alpine-base-3.22.2-v2

      - name: Cache aq snapshot
        id: snap-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/aq/snapshots/x86_64/provisioned
          key: aq-snapshot-${{ steps.key.outputs.snapkey }}

      - name: Diagnostics — fingerprint base + snapshot
        run: |
          echo "=== alpine base directory ==="
          ls -la ~/.local/share/aq/x86_64/ 2>&1 || echo "(not present)"
          for f in ~/.local/share/aq/x86_64/*; do
            [ -f "$f" ] || continue
            echo "$(stat -c '%s %a %n' "$f") sha256=$(sha256sum "$f" | awk '{print $1}')"
          done
          echo "=== snapshot directory ==="
          ls -la ~/.local/share/aq/snapshots/x86_64/provisioned/ 2>&1 || echo "(not present)"
          for f in ~/.local/share/aq/snapshots/x86_64/provisioned/*; do
            [ -f "$f" ] || continue
            echo "$(stat -c '%s %a %n' "$f") sha256=$(sha256sum "$f" | awk '{print $1}')"
          done
          echo "=== qemu-img info on snapshot disk ==="
          qemu-img info --force-share ~/.local/share/aq/snapshots/x86_64/provisioned/disk.qcow2 2>&1 || echo "(missing)"
          echo "=== qemu-img info on alpine base ==="
          qemu-img info ~/.local/share/aq/x86_64/alpine-base-3.22.2-x86_64.raw 2>&1 || echo "(missing)"

      - name: Provision snapshot if cache miss
        if: steps.snap-cache.outputs.cache-hit != 'true'
        run: |
          set -ex
          aq new app
          aq start app
          aq scp -r . app:/repo
          aq exec app /repo/bin/aq-provision
          aq stop app
          aq snapshot create app provisioned
          aq rm app

      - name: Run rubocop / minitest / system tests in parallel via aq fanout
        run: |
          set -x
          aq new --from-snapshot=provisioned staging
          if ! aq start staging; then
            echo "=== aq start failed; inspecting snapshot rootfs ==="
            aq stop staging 2>/dev/null || true
            sudo modprobe nbd max_part=8 || true
            sudo qemu-nbd -c /dev/nbd0 ~/.local/share/aq/staging/storage.qcow2 || \
              sudo qemu-nbd --read-only -c /dev/nbd0 ~/.local/share/aq/snapshots/x86_64/provisioned/disk.qcow2
            sleep 2
            sudo lsblk /dev/nbd0
            sudo mkdir -p /mnt/inspect
            sudo mount /dev/nbd0p3 /mnt/inspect 2>&1 || sudo mount /dev/nbd0 /mnt/inspect 2>&1 || true
            echo "=== /etc/ssh/sshd_config ==="
            sudo cat /mnt/inspect/etc/ssh/sshd_config 2>&1 | grep -vE '^#|^$' || true
            echo "=== /etc/inittab ==="
            sudo cat /mnt/inspect/etc/inittab 2>&1 || true
            echo "=== /etc/nologin ==="
            sudo ls -la /mnt/inspect/etc/nologin 2>&1 || true
            echo "=== /etc/hosts.deny ==="
            sudo cat /mnt/inspect/etc/hosts.deny 2>&1 || true
            echo "=== /root/.ssh/authorized_keys ==="
            sudo cat /mnt/inspect/root/.ssh/authorized_keys 2>&1 || true
            echo "=== /etc/passwd root entry ==="
            sudo grep '^root:' /mnt/inspect/etc/passwd 2>&1 || true
            echo "=== /var/log/messages tail ==="
            sudo tail -50 /mnt/inspect/var/log/messages 2>&1 || true
            sudo umount /mnt/inspect 2>&1 || true
            sudo qemu-nbd -d /dev/nbd0 2>&1 || true
            exit 1
          fi
          aq scp -r . staging:/repo
          aq stop staging
          aq snapshot create staging running-with-code
          aq rm staging

          aq fanout running-with-code 3 -- '
            cd /repo
            export DATABASE_URL=postgres://rails:rails@localhost:5432
            rc-service postgresql start || pg_ctl -D /var/lib/postgresql/17/data start
            case $AQ_SHARD_INDEX in
              0) bundle exec rubocop ;;
              1) RAILS_ENV=test bin/rails test ;;
              2) RAILS_ENV=test bin/rails test:system ;;
            esac
          '

      - name: Cleanup ephemeral snapshot
        if: always()
        run: aq snapshot rm --force running-with-code 2>/dev/null || true
